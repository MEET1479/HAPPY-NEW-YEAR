<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Alert</title>
    <style>
        body {
            background-color: #000000;
            color: #ff0000;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .warning-box {
            border: 3px solid #ff0000;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px #ff0000;
            max-width: 500px;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            animation: blink 1s infinite;
        }
        p {
            font-size: 1.2rem;
            color: #ffffff;
            margin-bottom: 20px;
        }
        .prank-note {
            font-size: 0.9rem;
            color: #00ff00;
            margin-top: 25px;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
    </style>
</head>
<body>

    <div class="warning-box">
        <h1>⚠️ चेतावनी! ⚠️</h1>
        <p>आपका फोन हैक हो गया है!</p>
        <p style="font-size: 1rem; color: #cccccc;">सिस्टम डेटा स्कैन किया जा रहा है...</p>
        <div class="prank-note">  </div>
    </div>

</body>
</html>
